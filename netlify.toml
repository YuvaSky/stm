[build]
  command = "cd frontend && npm install && npm run build && cd ../backend && npm install"
  publish = "frontend/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # esbuild bundles the backend code imported by the function, so backend/**
  # (and its node_modules) must not be copied in wholesale. mongodb-memory-server
  # is a local-dev fallback that ships a full MongoDB binary; keep it out of the bundle.
  ignored_node_modules = ["mongodb-memory-server"]

# Route /api/* requests directly to Express Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Route /uploads/* requests to Netlify Function if needed
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# Client-Side SPA routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
