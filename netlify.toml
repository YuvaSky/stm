[build]
  command = "npm install && cd frontend && npm install && npm run build && cd ../backend && npm install"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "production"
  NETLIFY = "true"
  JWT_SECRET = "super_secret_secure_print_key_2026_antigravity"
  AGENT_SECRET = "agent_secret_token_876634"
  RETENTION_MINUTES = "60"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongodb-memory-server"]

# Route /api/* requests directly to Express Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Route /uploads/* requests to Netlify Function if needed
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# Client-Side SPA routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
